# stocksBreakout — server deployment (single Linux VM). See deploy/README.md.
#
# Three services share one built image:
#   scanner-cron  — supercronic runs docker/crontab (all scheduled scans + the
#                   surge monitor, which the crontab starts at 08:00 ET weekdays)
#   api           — FastAPI mobile server (uvicorn :8000)
#   cloudflared   — Cloudflare tunnel; serves gilhadas-stocks.com from this box
# Plus one service built from a sibling repo checkout (../TradeManagment):
#   journal       — Trade Journal SPA (nginx :80, journal.gilhadas-stocks.com)
#
# Prerequisites on the VM (see deploy/README.md):
#   - .env at repo root (copy deploy/.env.example, fill in secrets)
#   - deploy/cloudflared/config.yml + the tunnel credentials <UUID>.json
#
# Bring up:    docker compose up -d --build
# Logs:        docker compose logs -f scanner-cron
# Manual scan: docker compose run --rm scanner-cron \
#                python3 breakout_scanner.py input/ALL.txt --mode swing --cron --no-notify

# Memory limits (added 2026-07-23 after the box wedged for 7h)
# ---------------------------------------------------------------------------
# ⚠ OUTDATED AS WRITTEN — the box is a t3.medium (4 GiB, ~3900 MB usable) since
# the §17 resize on 2026-07-28. The history below is kept because the FAILURE it
# describes is still the reason these caps exist; only the machine changed.
#
# The VM was a t3.small: 2 GB RAM total, no swap, six containers, and until then
# no per-container limit anywhere. With no cgroup limit the *host* OOM killer
# picks its victims by badness score — on 2026-07-22 18:00 ET it took out the
# network daemons rather than the scan that caused the pressure, so the box kept
# burning CPU while being completely unreachable (Tailscale down, tunnel down,
# 530s) until a manual reboot. Both the host and containerised Tailscale devices
# went offline together, so the redundancy added on 2026-07-22 did not help:
# the failure was host-wide, not a tailscaled hang.
#
# With mem_limit set, the offending container's own cgroup OOM killer fires
# instead, killing only that container — which `restart: unless-stopped` then
# brings back — while the tunnel and Tailscale survive and the box stays
# reachable. oom_score_adj tells the host killer to avoid those two lifelines.
# Caps are ceilings, not reservations, so they may sum above physical RAM.
# Current numbers assume the t3.medium (~3900 MB usable) + the 4 GB swapfile
# from deploy/setup-swap.sh; revisit them if the box is resized or migrated.

# Log rotation (added 2026-07-23) — plain json-file has no rotation by default.
# Found 9.6GB of stale Docker BUILD CACHE (not container logs) eating the 30GB
# disk down to 82% used the same day this was written — a repeat of the "No
# space left on device" incident from the original cutover (section 9). Build
# cache isn't bounded by this block (only `docker builder prune` clears it;
# there's no cache-size compose setting), but container log growth is a
# separate, ongoing risk this DOES close off — cap it now before it compounds.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Shared config for the two Python services (same image, env, volumes).
x-app: &app
  <<: *logging
  build:
    context: .
  image: stocksbreakout:latest
  env_file: .env
  restart: unless-stopped
  environment:
    TZ: America/New_York          # already set in Dockerfile; explicit here too
    # Keep the HuggingFace/FinBERT cache inside the appuser-owned scanner_output
    # volume — avoids the named-volume root-ownership pitfall on ~/.cache.
    HF_HOME: /app/scanner_output/.hf_cache
  volumes:
    - scanner_output:/app/scanner_output
    - input_data:/app/input

services:
  # ── Scheduled scans + surge monitor (supercronic) ──────────────────────────
  scanner-cron:
    <<: *app
    container_name: sb-scanner-cron
    # Default image CMD = supercronic /app/docker/crontab (see Dockerfile).
    # init: true runs tini as PID 1 so supercronic isn't — its own zombie-reap
    # code crashes fatally every ~60s when it IS pid 1 in this environment
    # ("Failed to fork exec: no such file or directory"), silently killing all
    # scheduled scans. As a non-pid-1 process it correctly no-ops reaping
    # instead (tini reaps for it), per its own -no-reap flag semantics.
    init: true
    # Memory cap — see the "Memory limits" note above. This is the container that
    # loads FinBERT (~440 MB of weights + torch runtime) on the 16:30 ET swing
    # scan; it is the one that must die first if anything does.
    #
    # History: 1024m → 1400m (§15) → 2500m (§17) → 1500m (§21, current).
    # The first three were all sized from TRUNCATED peaks — see the warning at
    # the end of this block, which is the lesson worth keeping.
    #
    # Applying a change: `git pull` then `docker compose up -d scanner-cron`.
    # A stop/start alone restarts containers with their OLD limits.
    #
    # Also measured and still true (§16/§17), so don't re-litigate them:
    #   * FinBERT costs a FLAT ~704 MiB once the model loads — 12 MiB baseline →
    #     115 on import → 704 on first inference, identical for a 64-headline
    #     batch. Scoring fewer headlines saves nothing; it is residency, not
    #     inference volume.
    #   * Freeing the model after use returns only 132 MiB of 742 (18%); the
    #     rest is torch/transformers runtime and allocator arenas that never
    #     return to the OS. It also loads at the END of the scan, so freeing it
    #     afterwards cannot lower peak.
    #   * int8 dynamic quantization shifts FinBERT confidence by up to 0.32,
    #     straddling the 0.80/0.88 FINBERT_PROMOTION thresholds — it would
    #     silently change which positions are opened. Not a drop-in.
    #
    # 2026-07-30: 2500m -> 1500m, sized from the FIRST measurement that was not
    # truncated by the OOM killer. One instrumented wide all.txt scan (1363
    # symbols, SB_MEM_TRACE=1) completed cleanly in 26 min at peak RSS 1013.6MB
    # / cgroup 912.2MB — 36.5% of the 2500m cap. 1500m leaves ~64% headroom over
    # that peak.
    #
    # Why this is now safe when 1400m was not: every earlier figure was a
    # CEILING, not demand. The process expanded to fill whatever cap it was
    # given (died ~1.37GiB under 1400m, ~2.45GiB under 2500m) because
    # utils._s3_fs() rebuilt a botocore client per S3 call, ~12.8MB each, never
    # released — 858 archive files ≈ 11GB of demand (§19). With that fixed and
    # ingestion bounded (§20), the same scan reads ONE file (to_load=1, "1
    # signal file(s) read once for 3 book(s)") and peak is a real working set:
    # ~704MB flat FinBERT residency + ~300MB scan.
    #
    # ⚠ Peak == cap on every observation means unbounded growth, not
    # under-provisioning. If a scan ever again peaks near this limit, RAISING it
    # is the wrong move — that is the signature of a leak, and it cost three
    # wrong diagnoses (§15 raised the cap, §17 resized the box, §18 found the
    # replay) before §19 measured the real per-call term.
    #
    # 2026-08-02: 1500m -> 2048m for the Oracle aarch64 box (§23). This IS the
    # "peak == cap" case the warning above forbids raising for — so it was only
    # raised after proving the growth is FLAT, by two independent measurements.
    #
    #   (a) FinBERT residency isolated on ARM, across a 256x workload range:
    #       baseline 9.3MB -> import 114.8MB -> 1st inference 923.1MB
    #       -> 16 headlines 923.1MB -> 64: 923.1MB -> 256: 923.1MB
    #       Unchanged at every batch size — the same flat signature §16 found on
    #       x86 (704.4MB). aarch64 model residency is +218.7MB.
    #
    #   (b) THE DECISIVE ONE — two full all.txt scans, same flags, cap the only
    #       difference:
    #         1500m: completed 1846s, peak RSS 1231.8MB, cgroup 1500.0/1500=100%
    #         2048m: completed 1794s, peak RSS 1002.2MB, cgroup  887.6/2048=43.3%
    #       Peak went DOWN when given a bigger cap — the exact inverse of the
    #       §15/§17 pathology, where the process expanded to fill whatever cap it
    #       was given (~1.37GiB under 1400m, ~2.45GiB under 2500m). With headroom
    #       the working set settles instead of thrashing against the ceiling.
    #
    #   ⚠ Corrects an over-attribution made mid-diagnosis: run (b)'s 1231.8MB was
    #   largely a PRESSURE ARTIFACT of being pinned at the cap, not a genuine ARM
    #   cost. The real aarch64 working set (1002.2MB) is within 1.1% of the x86
    #   baseline (§21: 1013.6MB). FinBERT's +218.7MB is real but does not
    #   propagate to whole-scan peak — peak is a high-water mark, not a sum.
    #
    #   2048m leaves ~104% headroom over the 1002.2MB natural peak, still binds
    #   hard (17% of the box's 11927MB, so the cgroup killer always fires before
    #   the host killer — the inversion that is the whole point of these caps),
    #   and still trips on a 2x regression.
    #   Do NOT raise further without an equivalent flat-vs-growing measurement.
    mem_limit: 2048m

  # ── Mobile API server ──────────────────────────────────────────────────────
  api:
    <<: *app
    container_name: sb-api
    command: ["uvicorn", "api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 384m
    # Bind to loopback only — public traffic arrives via the cloudflared tunnel,
    # which reaches the container over the compose network as http://api:8000.
    # 127.0.0.1:8000 on the host is just for local curl/debug on the VM.
    ports:
      - "127.0.0.1:8000:8000"

  # ── Streamlit dashboard (SSH-tunnel only, not exposed via cloudflared) ─────
  dashboard:
    <<: *app
    container_name: sb-dashboard
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    # NOTE: the `<<` merge key does not deep-merge `environment` — this block
    # replaces the anchor's entirely, so HF_HOME must be repeated here or the
    # container falls back to the root-ownership pitfall on ~/.cache.
    environment:
      # Server-side calls stay on the compose network (no tunnel round trip).
      API_BASE_URL: http://api:8000
      # Handed to the BROWSER for the Google OAuth link, so it must be publicly
      # resolvable — http://api:8000 is a Docker-internal name no browser can
      # reach, which is exactly how Google login broke here. See app.py.
      PUBLIC_API_BASE_URL: https://api.gilhadas-stocks.com
      HF_HOME: /app/scanner_output/.hf_cache
    ports:
      # Loopback only — reach it with: ssh -L 8501:localhost:8501 <vm>
      - "127.0.0.1:8501:8501"
    mem_limit: 320m
    depends_on:
      - api

  # ── Trade Journal (separate repo — static Vite build + nginx) ──────────────
  # Requires the TradeManagment repo cloned NEXT TO this one on the VM
  # (../TradeManagment), and VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY in .env
  # (build-time args — rebuild this service when they change). Public traffic
  # arrives via cloudflared as journal.gilhadas-stocks.com -> http://journal:80.
  journal:
    <<: *logging
    build:
      context: ../TradeManagment
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: trade-journal:latest
    container_name: sb-journal
    restart: unless-stopped
    ports:
      # Loopback only, for local curl/debug on the VM.
      - "127.0.0.1:8081:80"
    mem_limit: 64m

  # ── Cloudflare tunnel (public entrypoint) ──────────────────────────────────
  cloudflared:
    <<: *logging
    image: cloudflare/cloudflared:latest
    container_name: sb-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      # config.yml + <UUID>.json credentials live here (gitignored, provisioned
      # on the VM). Ingress origin points at http://api:8000.
      - ./deploy/cloudflared:/etc/cloudflared:ro
    # Lifeline #1 — this is how the box is reachable from the internet. The
    # negative oom_score_adj tells the host OOM killer to pick almost anything
    # else first; on 2026-07-22 it picked this and the box went dark for 7h.
    mem_limit: 128m
    oom_score_adj: -500
    depends_on:
      - api

  # ── Tailscale (redundant connectivity — separate device from the host) ─────
  # Own named volume (tailscale_state), NOT the host's /var/lib/tailscale — the
  # container gets its own tailnet identity (TS_HOSTNAME=sb-docker) rather than
  # racing the host's own tailscaled over shared state, which risks the exact
  # kind of hang that took the host's Tailscale offline for ~18h on 2026-07-22.
  # Registers as a second, independent device — reach it if the host's own
  # tailscaled/network stack wedges again. Requires TS_AUTHKEY in .env.
  tailscale:
    <<: *logging
    image: tailscale/tailscale:latest
    container_name: sb-tailscale
    restart: unless-stopped
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=sb-docker
    # `wait` at the end is load-bearing: without it, the shell's PID 1 exits the
    # instant `tailscale up` returns, killing the whole container (including the
    # backgrounded tailscaled) — caused a restart-loop in initial testing even
    # though auth succeeded every time.
    command: sh -c "tailscaled & sleep 2 && tailscale up --authkey=${TS_AUTHKEY} --hostname=sb-docker --accept-routes; wait"
    # Lifeline #2 — the SSH path when the tunnel is down (the security group has
    # no inbound rules at all, so this is the only way in). Same protection as
    # cloudflared: never the OOM victim.
    mem_limit: 128m
    oom_score_adj: -500

volumes:
  # Named volumes are initialised from the image's (appuser-owned) directories on
  # first run, so ownership is correct and data persists across rebuilds.
  # Back up:  docker run --rm -v stocksbreakout_scanner_output:/data busybox \
  #             tar czf - /data > backup.tar.gz
  scanner_output:   # signals, portfolio state, lists, logs, users.db, HF cache
  input_data:       # watchlists + runtime-exported premium/momentum lists
    # NOTE: seeded from the image's input/ once. After changing committed
    # watchlists in git, re-seed the file, e.g.:
    #   docker compose cp ./input/ALL.txt scanner-cron:/app/input/ALL.txt
  tailscale_state:  # this container's own tailnet identity — do NOT share
                    # the host's /var/lib/tailscale (see tailscale service note)
