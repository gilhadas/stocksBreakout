[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "quantkit"
version     = "1.0.0"
description = "Quantitative trading toolkit — indicators, patterns, Fibonacci, regime detection, sentiment"
readme      = "quantkit/README.md"
requires-python = ">=3.10"
license     = {text = "MIT"}
authors     = [{name = "Gil Hadas", email = "gil.hadas@gmail.com"}]
keywords    = ["trading", "technical-analysis", "finance", "quant"]

# Core: pure pandas/numpy (no network, no GPU)
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "requests>=2.28",
]

[project.optional-dependencies]
# FinBERT financial sentiment (downloads ~420 MB model on first use)
sentiment = [
    "transformers>=4.30",
    "torch>=2.0",
]
# Live data fetching helpers (yfinance for fetch_headlines, regime data)
data = [
    "yfinance>=0.2.40",
]
# Everything
all = [
    "transformers>=4.30",
    "torch>=2.0",
    "yfinance>=0.2.40",
]

[tool.setuptools.packages.find]
where    = ["."]
include  = ["quantkit*"]
exclude  = ["tests*", "scanner_output*", "input*"]

[tool.setuptools.package-data]
quantkit = ["py.typed"]
